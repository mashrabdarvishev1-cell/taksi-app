<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Haydovchi — Taksi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --asphalt:#1C1E24;
  --asphalt-2:#292C34;
  --sand:#EFEAE0;
  --card:#FFFFFF;
  --yellow:#F2B705;
  --teal:#114B5F;
  --teal-light:#1C7C93;
  --green:#3E7C4A;
  --red:#C1440E;
  --ink:#22252B;
  --ink-soft:#6B6E76;
  --line:#DDD7C8;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column;}

/* topbar */
.topbar{background:var(--asphalt);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar .title{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;}
.topbar .title span{color:var(--yellow);}
.balance-pill{background:var(--asphalt-2);border-radius:20px;padding:8px 14px;text-align:right;}
.balance-pill .num{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--yellow);}
.balance-pill .lbl{font-size:9.5px;color:#B7B9BF;}
.rank-pill{background:var(--teal-light);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;margin-top:6px;display:inline-block;}

.content{flex:1;padding:18px 20px 40px;}

/* auth card */
.auth-card{background:var(--card);border-radius:18px;padding:24px 20px;margin-top:30px;box-shadow:0 2px 10px rgba(28,30,36,0.06);}
.auth-card h2{font-family:'Oswald',sans-serif;font-size:18px;margin:0 0 4px;}
.auth-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
.auth-card input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#FCFBF8;font-size:14px;font-family:'Manrope',sans-serif;margin-bottom:12px;}
.auth-card input:focus{outline:none;border-color:var(--teal-light);}
.auth-card select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#FCFBF8;font-size:14px;font-family:'Manrope',sans-serif;margin-bottom:12px;color:var(--ink);}
.auth-card select:focus{outline:none;border-color:var(--teal-light);}
button.primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--yellow);color:var(--asphalt);font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;}
button.primary:disabled{opacity:0.5;}
.auth-msg{font-size:12px;color:var(--red);margin-top:10px;min-height:14px;}

/* balance warning */
.warn-card{background:#FBEFE3;border:1px solid #E9C58A;border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:12.5px;color:#8a5a00;}

/* my active order */
.section-h{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;margin:18px 0 10px;}
.ticket{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(28,30,36,0.06);border:1px solid var(--line);}
.ticket .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ticket .name{font-weight:700;font-size:14px;}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;color:#fff;white-space:nowrap;}
.b-waiting{background:var(--yellow);color:var(--asphalt);}
.b-accepted{background:var(--teal-light);}
.b-enroute{background:var(--teal);}
.b-done{background:var(--green);}
.b-cancelled{background:var(--red);}
.ticket .route{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:10px;}
.ticket .route .from,.ticket .route .to{flex:1;}
.ticket .route .arrow{color:var(--ink-soft);font-size:13px;}
.ticket .meta{font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
.ticket .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.act-btn{border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-family:'Manrope',sans-serif;font-weight:600;cursor:pointer;color:#fff;flex:1;}
.act-accept{background:var(--teal-light);}
.act-enroute{background:var(--teal);}
.act-done{background:var(--green);}
.act-cancel{background:transparent;color:var(--red);border:1.5px solid var(--red);}

.empty{font-size:13px;color:var(--ink-soft);padding:14px 0;text-align:center;}
.status-card{background:var(--card);border-radius:18px;padding:24px 20px;margin-top:30px;text-align:center;box-shadow:0 2px 10px rgba(28,30,36,0.06);}
.status-card .icon{font-size:34px;margin-bottom:12px;}
.status-card h3{font-family:'Oswald',sans-serif;font-size:16px;margin:0 0 6px;}
.status-card p{font-size:12.5px;color:var(--ink-soft);margin:0;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="title">HAYDOVCHI <span>PANEL</span></div>
      <div id="carInfo" style="font-size:11px;color:#B7B9BF;margin-top:2px;"></div>
      <div class="rank-pill" id="rankPill" style="display:none;"></div>
    </div>
    <div class="balance-pill" id="balancePill" style="display:none;">
      <div class="num" id="balanceNum">0</div>
      <div class="lbl">balans (so'm)</div>
    </div>
  </div>

  <div class="content">

    <div id="authView">
      <div class="auth-card">
        <h2>Ro'yxatdan o'tish</h2>
        <p>Mashina raqami, rusumi va telefon raqamingizni kiriting. Admin sizga razryad va balans belgilaydi.</p>
        <input id="regCarNumber" type="text" placeholder="Mashina raqami (01 A 123 AA)">
        <select id="regCarModel">
          <option value="">Mashina rusumini tanlang</option>
          <option value="Oq Nexia">Oq Nexia</option>
          <option value="Qora Nexia">Qora Nexia</option>
          <option value="Oq Lacetti">Oq Lacetti</option>
          <option value="Qora Lacetti">Qora Lacetti</option>
        </select>
        <input id="regPhone" type="tel" placeholder="+998 90 123 45 67">
        <button class="primary" id="regBtn">Kirish</button>
        <div class="auth-msg" id="authMsg"></div>
      </div>
    </div>

    <div id="mainView" style="display:none;">
      <div id="statusGate"></div>
      <div id="appBody">
      <div id="warnBox"></div>
      <div class="section-h">Mening zakasim</div>
      <div id="myOrder"><div class="empty">Faol zakas yo'q</div></div>

      <div class="section-h">Mavjud zakaslar</div>
      <div id="ordersList"><div class="empty">Yuklanmoqda...</div></div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzVUxZN6wbtxABFZMSOXWW2Hpx2-x6VAI",
  authDomain: "qulay-taksi.firebaseapp.com",
  projectId: "qulay-taksi",
  storageBucket: "qulay-taksi.firebasestorage.app",
  messagingSenderId: "455982111000",
  appId: "1:455982111000:web:6e643b10c878126afae66d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ordersCol = db.collection('orders');
const driversCol = db.collection('drivers');

const FEE = 3000; // zakas qabul qilish narxi (so'm)

const STATUS = {
  waiting:   { label: "Kutilmoqda",     cls: "b-waiting" },
  accepted:  { label: "Qabul qilindi",  cls: "b-accepted" },
  enroute:   { label: "Yo'lda",         cls: "b-enroute" },
  done:      { label: "Bajarildi",      cls: "b-done" },
  cancelled: { label: "Bekor qilindi",  cls: "b-cancelled" },
};

const authView = document.getElementById('authView');
const mainView = document.getElementById('mainView');
const authMsg = document.getElementById('authMsg');
const regBtn = document.getElementById('regBtn');
const balancePill = document.getElementById('balancePill');
const balanceNum = document.getElementById('balanceNum');
const rankPill = document.getElementById('rankPill');
const warnBox = document.getElementById('warnBox');
const statusGate = document.getElementById('statusGate');
const appBody = document.getElementById('appBody');
const myOrderEl = document.getElementById('myOrder');
const ordersListEl = document.getElementById('ordersList');

let driver = null; // {id, name, phone, rank, balance}
let allOrders = [];

function fmtTime(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
}

/* ---------- auth ---------- */
async function findDriverByPhone(phone){
  const snap = await driversCol.where('phone', '==', phone).limit(1).get();
  if(snap.empty) return null;
  const doc = snap.docs[0];
  return { id: doc.id, ...doc.data() };
}

async function register(){
  const carNumber = document.getElementById('regCarNumber').value.trim();
  const carModel = document.getElementById('regCarModel').value;
  const phone = document.getElementById('regPhone').value.trim();
  if(!carNumber || !carModel || !phone){
    authMsg.textContent = "Iltimos, barcha maydonlarni to'ldiring";
    return;
  }
  regBtn.disabled = true;
  authMsg.textContent = "";
  try{
    let existing = await findDriverByPhone(phone);
    if(existing){
      driver = existing;
    } else {
      const id = 'd' + Date.now() + Math.random().toString(36).slice(2,7);
      const newDriver = { carNumber, carModel, phone, rank: 1, balance: 0, status: 'pending', createdAt: Date.now() };
      await driversCol.doc(id).set(newDriver);
      driver = { id, ...newDriver };
    }
    localStorage.setItem('driver_id', driver.id);
    enterApp();
  }catch(e){
    authMsg.textContent = "Xatolik: " + (e && e.message ? e.message : "ulanmadi");
  }
  regBtn.disabled = false;
}
regBtn.addEventListener('click', register);

function enterApp(){
  authView.style.display = 'none';
  mainView.style.display = 'block';
  balancePill.style.display = 'block';
  rankPill.style.display = 'inline-block';
  listenDriver();
  listenOrders();
}

function listenDriver(){
  driversCol.doc(driver.id).onSnapshot((doc) => {
    if(!doc.exists) return;
    driver = { id: doc.id, ...doc.data() };
    balanceNum.textContent = (driver.balance || 0).toLocaleString('ru-RU');
    rankPill.textContent = "Razryad: " + driver.rank;
    document.getElementById('carInfo').textContent = (driver.carModel || '') + ' · ' + (driver.carNumber || '');
    renderStatusGate();
    renderWarn();
    renderOrders();
  });
}

function renderStatusGate(){
  const status = driver.status || 'pending';
  if(status === 'pending'){
    statusGate.innerHTML = `
      <div class="status-card">
        <div class="icon">⏳</div>
        <h3>Tasdiqlanishni kuting</h3>
        <p>Hisobingiz hali admin tomonidan tasdiqlanmagan. Tasdiqlangandan so'ng zakaslarni ko'ra olasiz.</p>
      </div>`;
    appBody.style.display = 'none';
  } else if(status === 'blocked'){
    statusGate.innerHTML = `
      <div class="status-card">
        <div class="icon">🚫</div>
        <h3>Hisobingiz bloklangan</h3>
        <p>Batafsil ma'lumot uchun administratorga murojaat qiling.</p>
      </div>`;
    appBody.style.display = 'none';
  } else {
    statusGate.innerHTML = '';
    appBody.style.display = 'block';
  }
}

function renderWarn(){
  if((driver.balance || 0) < FEE){
    warnBox.innerHTML = `<div class="warn-card">⚠️ Balansingiz yetarli emas. Zakas qabul qilish uchun kamida ${FEE.toLocaleString('ru-RU')} so'm kerak. Adminga murojaat qiling.</div>`;
  } else {
    warnBox.innerHTML = '';
  }
}

/* ---------- orders ---------- */
function listenOrders(){
  ordersCol.onSnapshot((snapshot) => {
    allOrders = snapshot.docs.map(d => d.data());
    renderOrders();
  }, (e) => {
    console.error('yuklashda xatolik', e);
    ordersListEl.innerHTML = '<div class="empty">Ma\'lumotlar bazasiga ulanmadi</div>';
  });
}

function renderMyOrder(){
  const mine = allOrders.find(o => o.driverId === driver.id && (o.status === 'accepted' || o.status === 'enroute'));
  if(!mine){
    myOrderEl.innerHTML = '<div class="empty">Faol zakas yo\'q</div>';
    return;
  }
  const st = STATUS[mine.status] || STATUS.waiting;
  const div = document.createElement('div');
  div.className = 'ticket';
  const priceLine = mine.price ? `<div class="meta" style="font-size:14px;color:var(--green);font-weight:700;">Yo'lovchidan olinadigan narx: ${mine.price.toLocaleString('ru-RU')} so'm (${mine.distanceKm} km)</div>` : `<div class="meta">Narx aniqlanmadi — kelishib oling</div>`;
  div.innerHTML = `
    <div class="top">
      <div class="name">${mine.name}</div>
      <div class="badge ${st.cls}">${st.label}</div>
    </div>
    <div class="route">
      <div class="from">${mine.from}</div>
      <div class="arrow">→</div>
      <div class="to">${mine.to}</div>
    </div>
    <div class="meta">Vaqti: ${fmtTime(mine.createdAt)} · ${mine.phone}</div>
    ${priceLine}
  `;
  const actions = document.createElement('div');
  actions.className = 'actions';
  if(mine.status === 'accepted'){
    actions.appendChild(mkBtn("Yo'lga chiqish", 'act-enroute', () => updateOrderStatus(mine.id, 'enroute')));
    actions.appendChild(mkBtn('Bekor qilish', 'act-cancel', () => cancelOrder(mine.id)));
  } else if(mine.status === 'enroute'){
    actions.appendChild(mkBtn('Yakunlash', 'act-done', () => updateOrderStatus(mine.id, 'done')));
  }
  div.appendChild(actions);
  myOrderEl.innerHTML = '';
  myOrderEl.appendChild(div);
}

function mkBtn(label, cls, onClick){
  const b = document.createElement('button');
  b.className = 'act-btn ' + cls;
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

async function updateOrderStatus(id, status){
  try{ await ordersCol.doc(id).update({ status }); }
  catch(e){ alert('Xatolik: ' + e.message); }
}

async function cancelOrder(id){
  if(!confirm("Zakasni bekor qilmoqchimisiz? To'langan " + FEE.toLocaleString('ru-RU') + " so'm qaytarilmaydi.")) return;
  try{ await ordersCol.doc(id).update({ status: 'cancelled' }); }
  catch(e){ alert('Xatolik: ' + e.message); }
}

function renderAvailable(){
  const hasActive = allOrders.some(o => o.driverId === driver.id && (o.status === 'accepted' || o.status === 'enroute'));
  if(hasActive){
    ordersListEl.innerHTML = '<div class="empty">Avval joriy zakasingizni yakunlang</div>';
    return;
  }
  const waiting = allOrders
    .filter(o => o.status === 'waiting')
    .sort((a,b) => a.createdAt - b.createdAt);

  const visibleCount = Math.max(1, driver.rank || 1);
  const visible = waiting.slice(0, visibleCount);

  if(visible.length === 0){
    ordersListEl.innerHTML = '<div class="empty">Hozircha zakas yo\'q</div>';
    return;
  }

  ordersListEl.innerHTML = '';
  visible.forEach(o => {
    const div = document.createElement('div');
    div.className = 'ticket';
    const priceLine = o.price ? `<div class="meta" style="font-size:14px;color:var(--green);font-weight:700;">Narx: ${o.price.toLocaleString('ru-RU')} so'm (${o.distanceKm} km)</div>` : `<div class="meta">Narx aniqlanmagan</div>`;
    div.innerHTML = `
      <div class="top">
        <div class="name">${o.name}</div>
        <div class="badge b-waiting">Kutilmoqda</div>
      </div>
      <div class="route">
        <div class="from">${o.from}</div>
        <div class="arrow">→</div>
        <div class="to">${o.to}</div>
      </div>
      <div class="meta">Vaqti: ${fmtTime(o.createdAt)} · ${o.phone}</div>
      ${priceLine}
    `;
    const actions = document.createElement('div');
    actions.className = 'actions';
    const canAfford = (driver.balance || 0) >= FEE;
    const btn = mkBtn(canAfford ? `Qabul qilish (-${FEE.toLocaleString('ru-RU')})` : 'Balans yetarli emas', 'act-accept', () => acceptOrder(o.id));
    if(!canAfford) btn.disabled = true, btn.style.opacity = '0.5';
    actions.appendChild(btn);
    div.appendChild(actions);
    ordersListEl.appendChild(div);
  });
}

async function acceptOrder(orderId){
  const orderRef = ordersCol.doc(orderId);
  const driverRef = driversCol.doc(driver.id);
  try{
    await db.runTransaction(async (t) => {
      const orderSnap = await t.get(orderRef);
      const driverSnap = await t.get(driverRef);
      if(!orderSnap.exists || orderSnap.data().status !== 'waiting'){
        throw new Error('ALREADY_TAKEN');
      }
      const bal = (driverSnap.data() && driverSnap.data().balance) || 0;
      if(bal < FEE){
        throw new Error('NO_BALANCE');
      }
      t.update(orderRef, { status: 'accepted', driverId: driver.id, driverCarNumber: driver.carNumber, driverCarModel: driver.carModel, driverPhone: driver.phone });
      t.update(driverRef, { balance: bal - FEE });
    });
  }catch(e){
    if(e.message === 'ALREADY_TAKEN') alert('Kechirasiz, bu zakasni boshqa haydovchi oldi.');
    else if(e.message === 'NO_BALANCE') alert('Balansingiz yetarli emas.');
    else alert('Xatolik: ' + e.message);
  }
}

function renderOrders(){
  if(!driver) return;
  renderMyOrder();
  renderAvailable();
}

/* ---------- init ---------- */
(async function init(){
  const savedId = localStorage.getItem('driver_id');
  if(savedId){
    try{
      const doc = await driversCol.doc(savedId).get();
      if(doc.exists){
        driver = { id: doc.id, ...doc.data() };
        enterApp();
        return;
      }
    }catch(e){ /* davom etamiz, ro'yxatdan o'tish ko'rsatiladi */ }
  }
})();
</script>
</body>
</html>
