<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yo'lovchi — Taksi chaqirish</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --asphalt:#1C1E24;
  --asphalt-2:#292C34;
  --sand:#EFEAE0;
  --card:#FFFFFF;
  --yellow:#F2B705;
  --teal:#114B5F;
  --teal-light:#1C7C93;
  --green:#3E7C4A;
  --red:#C1440E;
  --ink:#22252B;
  --ink-soft:#6B6E76;
  --line:#DDD7C8;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column;}

/* ---------- MAP ---------- */
.map-wrap{position:relative;height:300px;flex-shrink:0;background:var(--asphalt);overflow:hidden;}
#mapReal{width:100%;height:100%;}

.map-pin{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-100%);
  z-index:500; text-align:center; pointer-events:none;
}
.map-pin .badge{
  width:40px;height:40px;border-radius:12px;background:var(--asphalt);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 4px 10px rgba(0,0,0,0.35); border:2px solid var(--yellow); margin:0 auto;
}
.map-pin .stick{width:2px;height:14px;background:var(--asphalt);margin:0 auto;}
.map-pin .dot{
  width:10px;height:10px;border-radius:50%;background:var(--red);margin:-2px auto 0;
  box-shadow:0 0 0 4px rgba(193,68,14,0.25);
}

.map-fab{
  position:absolute; bottom:14px; width:44px; height:44px; border-radius:50%;
  background:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.28); border:none; cursor:pointer;
  font-size:17px; color:var(--asphalt); z-index:600;
}
.map-fab:active{transform:scale(0.94);}
.map-fab.back{left:14px;}
.map-fab.locate{right:14px;color:var(--teal);}
.map-fab .spin{
  display:none; width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(17,75,95,0.25); border-top-color:var(--teal);
  animation:spin 0.7s linear infinite;
}
.map-fab.busy .spin{display:inline-block;}
.map-fab.busy .fab-glyph{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.badge-top{
  position:absolute; top:14px; left:14px; z-index:600;
  background:rgba(28,30,36,0.72); color:var(--sand); font-size:11px; font-weight:600;
  padding:6px 12px; border-radius:20px; font-family:'Manrope',sans-serif;
  max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ---------- SHEET ---------- */
.sheet{
  flex:1; background:var(--card); border-radius:26px 26px 0 0; margin-top:-20px;
  position:relative; z-index:10; padding:12px 20px 30px; box-shadow:0 -8px 24px rgba(28,30,36,0.08);
}
.drag-handle{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 16px;}

.sheet-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.sheet-icon{
  width:46px;height:46px;border-radius:14px;background:var(--asphalt);
  display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
}
.brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.3px;color:var(--asphalt);}
.brand span{color:var(--yellow);-webkit-text-stroke:0.6px var(--asphalt);}
.tagline{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

/* address card */
.addr-card{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:6px;background:#FCFBF8;}
.addr-row{display:flex;align-items:center;gap:12px;padding:12px 14px;}
.addr-row input{flex:1;min-width:0;border:none;background:transparent;font-family:'Manrope',sans-serif;font-size:14px;color:var(--ink);outline:none;}
.addr-row input::placeholder{color:var(--ink-soft);}
.addr-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.addr-icon.a{background:rgba(242,183,5,0.2);color:#8a6800;}
.addr-icon.b{background:rgba(28,124,147,0.15);color:var(--teal-light);}
.addr-divider{height:1px;background:var(--line);margin:0 14px;}
.locate-inline{
  flex-shrink:0;width:30px;height:30px;border-radius:8px;border:none;background:var(--sand);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--teal);font-size:13px;
}
.locate-inline .spin{
  display:none;width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(17,75,95,0.25);border-top-color:var(--teal);animation:spin 0.7s linear infinite;
}
.locate-inline.busy .spin{display:inline-block;}
.locate-inline.busy .fab-glyph{display:none;}
.locate-msg{font-size:11px;color:var(--ink-soft);margin:6px 2px 14px;min-height:14px;}

/* contact row */
.contact-row{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;margin-bottom:16px;}
.contact-row input{
  width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:#FCFBF8;font-size:13px;font-family:'Manrope',sans-serif;color:var(--ink);
}
.contact-row input:focus{outline:none;border-color:var(--teal-light);}

/* tariffs */
.tariffs-label{font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
.tariffs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tariffs::-webkit-scrollbar{display:none;}
.tariff-card{
  flex-shrink:0;width:104px;border-radius:16px;border:1.5px solid var(--line);
  background:#FCFBF8;padding:10px 10px 12px;cursor:pointer;position:relative;
}
.tariff-card.active{border-color:var(--asphalt);background:#fff;box-shadow:0 4px 14px rgba(28,30,36,0.12);}
.tariff-card .icon{font-size:25px;margin-bottom:8px;}
.tariff-card .time{
  position:absolute;top:8px;right:8px;background:#fff;border:1px solid var(--line);
  border-radius:8px;font-size:9.5px;padding:2px 6px;color:var(--ink-soft);font-weight:700;
}
.tariff-card.active .time{background:var(--asphalt);color:#fff;border-color:var(--asphalt);}
.tariff-card .label{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;color:var(--asphalt);margin-bottom:2px;}
.tariff-card .price{font-size:10.5px;color:var(--ink-soft);}
.tariff-card .price b{color:var(--ink);font-weight:700;}

/* bottom bar */
.bottom-bar{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.icon-btn{
  width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#FCFBF8;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:var(--ink-soft);
}
button.submit{
  flex:1;padding:14px;border:none;border-radius:14px;height:48px;
  background:var(--yellow);color:var(--asphalt);font-family:'Oswald',sans-serif;
  font-weight:600;font-size:14.5px;letter-spacing:0.2px;cursor:pointer;transition:transform 0.12s ease;
}
button.submit:active{transform:scale(0.98);}
button.submit:disabled{opacity:0.5;cursor:not-allowed;}

.msg{font-size:12.5px;color:var(--red);margin-top:8px;min-height:16px;}

.orders{padding-top:8px;}
.orders h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--asphalt);margin:14px 0 12px;}
.empty{font-size:13px;color:var(--ink-soft);padding:14px 0;}

.ticket{
  position:relative;background:var(--card);border-radius:16px;padding:16px 18px;
  margin-bottom:12px;box-shadow:0 2px 10px rgba(28,30,36,0.06);border:1px solid var(--line);
}
.ticket .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ticket .name{font-weight:700;font-size:14px;}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;color:#fff;white-space:nowrap;}
.b-waiting{background:var(--yellow);color:var(--asphalt);}
.b-accepted{background:var(--teal-light);}
.b-enroute{background:var(--teal);}
.b-done{background:var(--green);}
.b-cancelled{background:var(--red);}

.ticket .route{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:10px;}
.ticket .route .from,.ticket .route .to{flex:1;}
.ticket .route .arrow{color:var(--ink-soft);font-size:13px;}
.ticket .meta{font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
</style>
</head>
<body>
<div class="app">

  <div class="map-wrap">
    <div id="mapReal"></div>
    <div class="badge-top" id="mapBadge">Toshkent</div>
    <div class="map-pin">
      <div class="badge">🚕</div>
      <div class="stick"></div>
      <div class="dot"></div>
    </div>
    <button type="button" class="map-fab back" id="backFab" aria-label="Orqaga">
      <span class="fab-glyph">←</span>
    </button>
    <button type="button" class="map-fab locate" id="locateFab" aria-label="Joylashuvim">
      <span class="fab-glyph">➤</span><span class="spin"></span>
    </button>
  </div>

  <div class="sheet">
    <div class="drag-handle"></div>

    <div class="sheet-header">
      <div class="sheet-icon">🚕</div>
      <div>
        <div class="brand">YO'L<span>TAKSI</span></div>
        <div class="tagline">Shahar bo'ylab tezkor buyurtma</div>
      </div>
    </div>

    <div class="addr-card">
      <div class="addr-row">
        <div class="addr-icon a">●</div>
        <input id="f-from" type="text" placeholder="Qayerdan">
        <button type="button" class="locate-inline" id="locateBtn" aria-label="Joylashuvim">
          <span class="fab-glyph">📍</span><span class="spin"></span>
        </button>
      </div>
      <div class="addr-divider"></div>
      <div class="addr-row">
        <div class="addr-icon b">◆</div>
        <input id="f-to" type="text" placeholder="Qayerga">
      </div>
    </div>
    <div class="locate-msg" id="locateMsg"></div>

    <div class="contact-row">
      <input id="f-name" type="text" placeholder="Ismingiz" autocomplete="name">
      <input id="f-phone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
    </div>

    <div class="tariffs-label">Tarifni tanlang</div>
    <div class="tariffs" id="tariffs"></div>

    <div class="bottom-bar">
      <div class="icon-btn">💵</div>
      <button class="submit" id="submitBtn">Taksi chaqirish</button>
      <div class="icon-btn">⚙️</div>
    </div>
    <div class="msg" id="msg"></div>

    <div class="orders">
      <h3>Mening buyurtmalarim</h3>
      <div id="ordersList"><div class="empty">Hozircha buyurtma yo'q</div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzVUxZN6wbtxABFZMSOXWW2Hpx2-x6VAI",
  authDomain: "qulay-taksi.firebaseapp.com",
  projectId: "qulay-taksi",
  storageBucket: "qulay-taksi.firebasestorage.app",
  messagingSenderId: "455982111000",
  appId: "1:455982111000:web:6e643b10c878126afae66d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ordersCol = db.collection('orders');

const STATUS = {
  waiting:   { label: "Kutilmoqda",     cls: "b-waiting" },
  accepted:  { label: "Qabul qilindi",  cls: "b-accepted" },
  enroute:   { label: "Yo'lda",         cls: "b-enroute" },
  done:      { label: "Bajarildi",      cls: "b-done" },
  cancelled: { label: "Bekor qilindi",  cls: "b-cancelled" },
};

const TARIFFS = [
  { id:'standard', icon:'🚗', label:'Standart', time:'5 min', price:'12 000' },
  { id:'comfort',  icon:'🚙', label:'Komfort',  time:'7 min', price:'18 000' },
  { id:'moto',     icon:'🛵', label:'Mото',     time:'3 min', price:'8 000'  },
  { id:'cargo',    icon:'🚚', label:'Yuk',      time:'12 min', price:'35 000' },
];
let selectedTariff = TARIFFS[0].id;

const locateBtn = document.getElementById('locateBtn');
const locateFab = document.getElementById('locateFab');
const backFab = document.getElementById('backFab');
const locateMsg = document.getElementById('locateMsg');
const mapBadge = document.getElementById('mapBadge');
const fromEl = document.getElementById('f-from');
const toEl = document.getElementById('f-to');
const nameEl = document.getElementById('f-name');
const phoneEl = document.getElementById('f-phone');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
const ordersList = document.getElementById('ordersList');
const tariffsEl = document.getElementById('tariffs');

let myOrderIds = [];
let leafletMap = null;
let programmaticMove = false;

/* ---------- tariffs ---------- */
function renderTariffs(){
  tariffsEl.innerHTML = '';
  TARIFFS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'tariff-card' + (t.id === selectedTariff ? ' active' : '');
    card.innerHTML = `
      <div class="time">${t.time}</div>
      <div class="icon">${t.icon}</div>
      <div class="label">${t.label}</div>
      <div class="price">dan <b>${t.price}</b> so'm</div>
    `;
    card.addEventListener('click', () => { selectedTariff = t.id; renderTariffs(); });
    tariffsEl.appendChild(card);
  });
}
renderTariffs();

/* ---------- map ---------- */
let fromCoords = null;

async function reverseGeocode(lat, lng){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16&addressdetails=0`);
    const data = await res.json();
    if(data && data.display_name){ return data.display_name; }
  }catch(e){ /* koordinata bilan qolamiz */ }
  return lat.toFixed(5) + ', ' + lng.toFixed(5);
}

async function forwardGeocode(query){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
    const data = await res.json();
    if(data && data[0]){ return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) }; }
  }catch(e){ /* topilmadi */ }
  return null;
}

function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function calcPrice(distanceKm){
  const BASE_KM = 2, BASE_PRICE = 7000, PER_KM = 3000;
  if(distanceKm <= BASE_KM) return BASE_PRICE;
  const extraKm = Math.ceil(distanceKm - BASE_KM);
  return BASE_PRICE + extraKm * PER_KM;
}

function ensureMap(lat, lng, zoom){
  programmaticMove = true;
  if(!leafletMap){
    leafletMap = L.map('mapReal', { zoomControl:false, attributionControl:false }).setView([lat, lng], zoom || 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMap);
    L.control.attribution({ prefix:false }).addAttribution('© OpenStreetMap').addTo(leafletMap);
    leafletMap.on('moveend', onMapMoveEnd);
    setTimeout(() => leafletMap.invalidateSize(), 200);
  } else {
    leafletMap.setView([lat, lng], zoom || leafletMap.getZoom());
  }
}

async function onMapMoveEnd(){
  if(programmaticMove){ programmaticMove = false; return; }
  const c = leafletMap.getCenter();
  fromCoords = { lat: c.lat, lng: c.lng };
  const address = await reverseGeocode(c.lat, c.lng);
  fromEl.value = address;
  mapBadge.textContent = address.split(',')[0];
  locateMsg.textContent = "Xaritadan tanlandi";
}

/* ---------- locate ---------- */
async function locateMe(){
  if(!navigator.geolocation){
    locateMsg.textContent = "Brauzeringiz joylashuvni aniqlay olmaydi";
    return;
  }
  locateBtn.classList.add('busy');
  locateFab.classList.add('busy');
  locateBtn.disabled = true;
  locateMsg.textContent = "Aniqlanmoqda...";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    fromCoords = { lat: latitude, lng: longitude };
    ensureMap(latitude, longitude, 16);
    const address = await reverseGeocode(latitude, longitude);
    fromEl.value = address;
    mapBadge.textContent = address.split(',')[0];
    locateMsg.textContent = "Joylashuv aniqlandi";
    locateBtn.classList.remove('busy');
    locateFab.classList.remove('busy');
    locateBtn.disabled = false;
  }, (err) => {
    locateBtn.classList.remove('busy');
    locateFab.classList.remove('busy');
    locateBtn.disabled = false;
    if(err && err.code === 1){
      locateMsg.textContent = "Ruxsat berilmadi. Brauzer sozlamalarida joylashuvga ruxsat bering";
    } else if(err && err.code === 2){
      locateMsg.textContent = "Joylashuv aniqlanmadi. GPS yoki internetni tekshiring";
    } else if(err && err.code === 3){
      locateMsg.textContent = "Vaqt tugadi. Qaytadan urinib ko'ring";
    } else {
      locateMsg.textContent = "Joylashuvni aniqlab bo'lmadi";
    }
  }, { enableHighAccuracy: true, timeout: 8000 });
}
locateBtn.addEventListener('click', locateMe);
locateFab.addEventListener('click', locateMe);
backFab.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

/* ---------- orders ---------- */
function fmtTime(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
}

async function loadMyIds(){
  try{
    const raw = localStorage.getItem('my_order_ids');
    if(raw){ myOrderIds = JSON.parse(raw); }
  }catch(e){ myOrderIds = []; }
}

function saveMyIds(){
  try{ localStorage.setItem('my_order_ids', JSON.stringify(myOrderIds)); }
  catch(e){ console.error('saqlashda xatolik', e); }
}

async function fetchOrder(id){
  try{
    const doc = await ordersCol.doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ return null; }
}

function renderTicket(order){
  const st = STATUS[order.status] || STATUS.waiting;
  const div = document.createElement('div');
  div.className = 'ticket';
  const priceLine = order.price ? `<div class="meta">Taxminiy narx: <b>${order.price.toLocaleString('ru-RU')} so'm</b> (${order.distanceKm} km) — haydovchiga naqd to'lanadi</div>` : '';
  div.innerHTML = `
    <div class="top">
      <div class="name">${order.name || 'Mehmon'}</div>
      <div class="badge ${st.cls}">${st.label}</div>
    </div>
    <div class="route">
      <div class="from">${order.from}</div>
      <div class="arrow">→</div>
      <div class="to">${order.to}</div>
    </div>
    <div class="meta">Buyurtma vaqti: ${fmtTime(order.createdAt)} · ${order.phone}</div>
    ${priceLine}
  `;
  return div;
}

async function renderOrders(){
  if(myOrderIds.length === 0){
    ordersList.innerHTML = '<div class="empty">Hozircha buyurtma yo\'q</div>';
    return;
  }
  const orders = (await Promise.all(myOrderIds.map(fetchOrder))).filter(Boolean);
  orders.sort((a,b) => b.createdAt - a.createdAt);
  if(orders.length === 0){
    ordersList.innerHTML = '<div class="empty">Hozircha buyurtma yo\'q</div>';
    return;
  }
  ordersList.innerHTML = '';
  orders.forEach(o => ordersList.appendChild(renderTicket(o)));
}

async function submitOrder(){
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const from = fromEl.value.trim();
  const to = toEl.value.trim();

  if(!name || !phone || !from || !to){
    msgEl.textContent = "Iltimos, barcha maydonlarni to'ldiring";
    return;
  }
  msgEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Narx hisoblanmoqda...";

  let distanceKm = null;
  let price = null;
  try{
    let fc = fromCoords;
    if(!fc){ fc = await forwardGeocode(from); }
    const tc = await forwardGeocode(to);
    if(fc && tc){
      distanceKm = Math.round(haversineKm(fc, tc) * 10) / 10;
      price = calcPrice(distanceKm);
    }
  }catch(e){ /* masofa aniqlanmadi, narxsiz davom etamiz */ }

  btn.textContent = "Yuborilmoqda...";

  const id = 'o' + Date.now() + Math.random().toString(36).slice(2,7);
  const order = { id, name, phone, from, to, tariff: selectedTariff, distanceKm, price, status: 'waiting', createdAt: Date.now() };

  try{
    await ordersCol.doc(id).set(order);
    myOrderIds.unshift(id);
    saveMyIds();
    await renderOrders();
    fromEl.value = ''; toEl.value = ''; fromCoords = null;
  }catch(e){
    msgEl.textContent = "Xatolik: " + (e && e.message ? e.message : "ma'lumotlar bazasiga ulanmadi");
  }
  btn.disabled = false;
  btn.textContent = "Taksi chaqirish";
}
btn.addEventListener('click', submitOrder);
